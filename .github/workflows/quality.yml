name: qualité du code et tests

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - develop

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
            - name: Récupérer le chemin du cache composer
              id: composer-cache
              run: |
                  echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  extensions: mbstring, intl

            - name: Mise en cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os}}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os}}-composer-

            - name: Installer les dépendances Composer
              run: composer install --no-progress  --prefer-dist

            - name: Vérification du style avec PHP CS Fixer
              run: vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Analyse avec PHPStan
              run: vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress
            - name: Linter Twig
              run: bin/console lint:twig templates/
            - name: Linter YAML
              run: bin/console lint:yaml config/

    tests:
        needs: quality
        runs-on: ubuntu-latest
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
            - name: Récupérer le chemin du cache composer
              id: composer-cache
              run: |
                  echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  extensions: mbstring, intl

            - name: Mise en cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os}}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os}}-composer-

            - name: Installer les dépendances Composer
              run: composer install --no-progress  --prefer-dist
            - name: Lancer les tests
              run: php bin/phpunit
